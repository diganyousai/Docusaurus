# ============================================
# Decap CMS 配置（GitHub backend + Netlify CORS 代理 OAuth）
# ============================================
backend:
  name: github
  repo: diganyousai/Docusaurus
  branch: main
  open_authoring: false
  squash_merges: true

# 不开放邮件登录（只走 GitHub）
disable_email_login: true

# 注意：不要在这里写 site_url / display_url / logo_url
# Decap CMS 会把它们用在 OAuth site_id 参数拼接上，加上 https:// 会导致 Netlify OAuth 返回 404
# site_url 已被移除

# 媒体文件位置
media_folder: static/uploads
public_folder: /uploads

# ============== 内容集合 ==============
collections:
  # 1) 技能文档
  - name: skills
    label: 技能
    folder: docs/skills
    create: true
    slug: "{{slug}}"
    extension: md
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", default: 1, required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  # 2) 项目文档
  - name: projects
    label: 项目
    folder: docs/projects
    create: true
    slug: "{{slug}}"
    extension: md
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "侧边栏排序", name: "sidebar_position", widget: "number", default: 2, required: false }
      - { label: "项目背景", name: "background", widget: "text", required: false }
      - { label: "标签（逗号分隔）", name: "tags", widget: "string", required: false }
      - { label: "状态", name: "status", widget: "string", required: false, default: "已完成" }
      - { label: "正文", name: "body", widget: "markdown" }

  # 3) 关于
  - name: about
    label: 关于
    folder: docs/about-src
    create: true
    slug: "{{slug}}"
    extension: md
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "正文", name: "body", widget: "markdown" }
